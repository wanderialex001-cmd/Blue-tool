<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digit Plus Analyzer</title>
    <style>
        :root {
            --bg-color: #111827;
            --card-bg: #1f2937;
            --text-color: #f3f4f6;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --bar-color: #3b82f6;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 900px;
            width: 100%;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid #374151;
            padding-bottom: 10px;
        }
        h1 { margin: 0; font-size: 24px; color: var(--accent-green); }
        .status { font-size: 14px; padding: 5px 10px; border-radius: 20px; background: #374151; }
        .connected { color: var(--accent-green); }
        .disconnected { color: var(--accent-red); }
        
        /* Stats Panel */
        .stats-panel {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }
        .stat-card {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            border: 1px solid #374151;
        }
        .stat-val { font-size: 28px; font-weight: bold; margin-top: 5px; }

        /* Digit Grid */
        .digit-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }
        @media (min-width: 600px) {
            .digit-grid { grid-template-columns: repeat(5, 1fr); }
        }
        .digit-card {
            background: var(--card-bg);
            border-radius: 8px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 1px solid #374151;
            position: relative;
            transition: all 0.2s ease;
        }
        .digit-num { font-size: 32px; font-weight: bold; margin-bottom: 5px; }
        .digit-pct { font-size: 16px; color: #9ca3af; font-weight: 500; }
        
        /* Progress Bar Container */
        .bar-container {
            width: 100%;
            background: #374151;
            height: 6px;
            border-radius: 3px;
            margin-top: 10px;
            overflow: hidden;
        }
        .bar-fill {
            height: 100%;
            width: 0%;
            background: var(--bar-color);
            transition: width 0.3s ease;
        }
        
        /* Highlight Alert Styles */
        .hot-digit { border-color: var(--accent-green); box-shadow: 0 0 10px rgba(16, 185, 129, 0.2); }
        .cold-digit { border-color: var(--accent-red); box-shadow: 0 0 10px rgba(239, 68, 68, 0.2); }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>DIGIT PLUS ANALYZER</h1>
        <div id="status" class="status disconnected">Connecting...</div>
    </header>

    <!-- Top Analytical Stats -->
    <div class="stats-panel">
        <div class="stat-card">
            <div>UNDER (0 - 4)</div>
            <div id="under-pct" class="stat-val" style="color: #3b82f6;">0%</div>
        </div>
        <div class="stat-card">
            <div>OVER (5 - 9)</div>
            <div id="over-pct" class="stat-val" style="color: #f59e0b;">0%</div>
        </div>
        <div class="stat-card">
            <div>EVEN Ratio</div>
            <div id="even-pct" class="stat-val">0%</div>
        </div>
        <div class="stat-card">
            <div>ODD Ratio</div>
            <div id="odd-pct" class="stat-val">0%</div>
        </div>
    </div>

    <!-- Live Grid for Digits 0-9 -->
    <div class="digit-grid" id="grid-container">
        <!-- Generated by JavaScript dynamically -->
    </div>
</div>

<script>
    const statusEl = document.getElementById('status');
    const gridContainer = document.getElementById('grid-container');
    
    // Create UI elements for digits 0 to 9
    for (let i = 0; i <= 9; i++) {
        gridContainer.innerHTML += `
            <div class="digit-card" id="card-${i}">
                <div class="digit-num">${i}</div>
                <div class="digit-pct" id="pct-${i}">0.0%</div>
                <div class="bar-container"><div class="bar-fill" id="bar-${i}"></div></div>
            </div>
        `;
    }

    // Connect to Deriv's secure live data stream
    const ws = new WebSocket('wss://://derivws.com');
    let tickHistory = [];
    const MAX_TICKS = 100; // Analyzes rolling patterns across the last 100 ticks

    ws.onopen = () => {
        statusEl.textContent = "LIVE DATA CONNECTED";
        statusEl.className = "status connected";
        // Subscribe to Volatility 100 Index (Change "R_100" to "R_10" or "R_75" if desired)
        ws.send(JSON.stringify({ ticks: "R_100" }));
    };

    ws.onclose = () => {
        statusEl.textContent = "DISCONNECTED";
        statusEl.className = "status disconnected";
    };

    ws.onmessage = (event) => {
        const data = JSON.parse(event.data);
        if (data.tick) {
            const quoteString = data.tick.quote.toFixed(data.tick.pip_size);
            const lastDigit = parseInt(quoteString.slice(-1));
            
            tickHistory.push(lastDigit);
            if (tickHistory.length > MAX_TICKS) tickHistory.shift();

            calculateAnalytics();
        }
    };

    function calculateAnalytics() {
        const counts = Array(10).fill(0);
        let underCount = 0, overCount = 0, evenCount = 0, oddCount = 0;
        const total = tickHistory.length;

        // Loop over tick history to group frequencies
        tickHistory.forEach(digit => {
            counts[digit]++;
            if (digit <= 4) underCount++; else overCount++;
            if (digit % 2 === 0) evenCount++; else oddCount++;
        });

        // 1. Update Core Panel Metrics
        document.getElementById('under-pct').textContent = ((underCount / total) * 100).toFixed(0) + '%';
        document.getElementById('over-pct').textContent = ((overCount / total) * 100).toFixed(0) + '%';
        document.getElementById('even-pct').textContent = ((evenCount / total) * 100).toFixed(0) + '%';
        document.getElementById('odd-pct').textContent = ((oddCount / total) * 100).toFixed(0) + '%';

        // 2. Update Grid Display Blocks dynamically
        for (let i = 0; i <= 9; i++) {
            const pct = (counts[i] / total) * 100;
            const pctText = document.getElementById(`pct-${i}`);
            const barFill = document.getElementById(`bar-${i}`);
            const card = document.getElementById(`card-${i}`);

            pctText.textContent = pct.toFixed(1) + '%';
            barFill.style.width = pct + '%';

            // Visual markers for high statistical deviation (Over 14% = Hot, Under 7% = Cold)
            card.className = 'digit-card'; 
            if (pct >= 14) card.classList.add('hot-digit');
            if (pct <= 7 && total >= 30) card.classList.add('cold-digit');
        }
    }
</script>
</body>
  </html>
